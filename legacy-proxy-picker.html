ifact: Search your library for a card, put it into your hand, then shuffle. An opponent gains control of this artifact. Activate only during your turn."]],"Wistfulness":[["Wistfulness","{3}{G/U}{G/U}","Creature — Elemental Incarnation","When this creature enters, if {G}{G} was spent to cast it, exile target artifact or enchantment an opponent controls.\nWhen this creature enters, if {U}{U} was spent to cast it, draw two cards, then discard a card.\nEvoke {G/U}{G/U} (You may cast this spell for its evoke cost. If you do, it's sacrificed when it enters.)"]],"Witch Enchanter":[["Witch Enchanter","{3}{W}","Creature — Human Warlock","When this creature enters, destroy target artifact or enchantment an opponent controls."],["Witch-Blessed Meadow","","Land","As this land enters, you may pay 3 life. If you don't, it enters tapped.\n{T}: Add {W}."]],"Witherbloom Apprentice":[["Witherbloom Apprentice","{B}{G}","Creature — Human Druid","Magecraft — Whenever you cast or copy an instant or sorcery spell, each opponent loses 1 life and you gain 1 life."]],"Witherbloom Charm":[["Witherbloom Charm","{B}{G}","Instant","Choose one —\n• You may sacrifice a permanent. If you do, draw two cards.\n• You gain 5 life.\n• Destroy target nonland permanent with mana value 2 or less."]],"Witherbloom Command":[["Witherbloom Command","{B}{G}","Sorcery","Choose two —\n• Target player mills three cards, then you return a land card from your graveyard to your hand.\n• Destroy target noncreature, nonland permanent with mana value 2 or less.\n• Target creature gets -3/-1 until end of turn.\n• Target opponent loses 2 life and you gain 2 life."]],"Wooded Foothills":[["Wooded Foothills","","Land","{T}, Pay 1 life, Sacrifice this land: Search your library for a Mountain or Forest card, put it onto the battlefield, then shuffle."]],"Wrath of God":[["Wrath of God","{2}{W}{W}","Sorcery","Destroy all creatures. They can't be regenerated."]],"Wrath of the Skies":[["Wrath of the Skies","{X}{W}{W}","Sorcery","You get X {E} (energy counters), then you may pay any amount of {E}. Destroy each artifact, creature, and enchantment with mana value less than or equal to the amount of {E} paid this way."]],"Wrenn's Resolve":[["Wrenn's Resolve","{1}{R}","Sorcery","Exile the top two cards of your library. Until the end of your next turn, you may play those cards."]],"Xander's Lounge":[["Xander's Lounge","","Land — Island Swamp Mountain","({T}: Add {U}, {B}, or {R}.)\nThis land enters tapped.\nCycling {3} ({3}, Discard this card: Draw a card.)"]],"Yavimaya, Cradle of Growth":[["Yavimaya, Cradle of Growth","","Legendary Land","Each land is a Forest in addition to its other land types."]],"Yggdrasil, Rebirth Engine":[["Yggdrasil, Rebirth Engine","{3}","Legendary Artifact","When Yggdrasil enters, exile all creature cards from your graveyard.\n{T}: Exile the top three cards of your library.\n{4}, {T}: Put a creature card exiled with Yggdrasil onto the battlefield under your control. It gains haste until end of turn. Activate only as a sorcery."]],"Yuriko, the Tiger's Shadow":[["Yuriko, the Tiger's Shadow","{1}{U}{B}","Legendary Creature — Human Ninja","Commander ninjutsu {U}{B} ({U}{B}, Return an unblocked attacker you control to hand: Put this card onto the battlefield from your hand or the command zone tapped and attacking.)\nWhenever a Ninja you control deals combat damage to a player, reveal the top card of your library and put that card into your hand. Each opponent loses life equal to that card's mana value."]],"Éowyn, Fearless Knight":[["Éowyn, Fearless Knight","{2}{R}{W}","Legendary Creature — Human Knight","Haste\nWhen Éowyn enters, exile target creature an opponent controls with greater power. Legendary creatures you control gain protection from each of that creature's colors until end of turn."]]};
const key='legacy-proxy-picker-v1';
const byId=id=>document.getElementById(id);
let saved={};
try{saved=JSON.parse(localStorage.getItem(key))||{};}catch{}
const catalog=[...initial,...(saved.custom||[]).filter(([name])=>!initial.some(([card])=>card===name))];
const cardsByName=new Map(catalog.map(card=>[card[0],card]));
for(const deck of [...decks].sort((a,b)=>a.name.localeCompare(b.name))){
  byId('deck').add(new Option(deck.name,deck.name));
}
const activeDeck=()=>decks.find(deck=>deck.name===byId('deck').value);
function coverage(){
  const deck=activeDeck(), info=byId('coverage'), source=byId('source');
  source.replaceChildren();
  if(!deck){info.textContent=decks.length+' Archetypen · '+catalog.length+' Karten im Katalog';return;}
  const entries=Object.entries(deck.example);
  const missing=entries.reduce((sum,[name,count])=>sum+Math.max(0,count-(selected.get(name)||0)),0);
  info.textContent=deck.name+' · '+deck.sample+' ausgewertete Listen · '+deck.cards.length+' Karten im Ranking · Beispiel: '+(missing?missing+' Exemplare fehlen':'vollständig abgedeckt');
  for(const [label,url] of [['Archetyp',deck.source],['Beispielliste',deck.exampleUrl]]){
    if(source.childNodes.length)source.append(' · ');
    const link=document.createElement('a');link.href=url;link.textContent=label;link.target='_blank';link.rel='noopener';source.append(link);
  }
}
const selected=new Map(catalog.map(([name,recommended,,land])=>[name,saved.quantities?.[name]??(land?recommended:0)]));
const quantities=new Map(catalog.map(([name,recommended])=>[name,saved.preferred?.[name]||selected.get(name)||recommended]));
function save(){
  try{localStorage.setItem(key,JSON.stringify({custom:catalog.slice(initial.length),quantities:Object.fromEntries(selected),preferred:saved.preferred}));}catch{byId('status').textContent='Lokales Speichern nicht verfügbar. Exportiere deine Auswahl.';}
}
function summary(){
  coverage();
  const total=[...selected.values()].reduce((a,b)=>a+b,0);
  const remaining=620-total;
  byId('total').textContent=total+' / 620 Exemplare · '+(remaining>=0?remaining+' frei':-remaining+' über dem Limit');
  document.querySelector('progress').value=Math.min(620,total);
  for(const id of ['download','copy'])byId(id).disabled=total===0||remaining<0;
}
function cardPreview(name){
  const wrap=document.createElement('div');
  wrap.className='card-info';
  const faces=Object.hasOwn(cardInfo,name)?cardInfo[name]:null;
  if(!faces){
    const link=document.createElement('a');
    link.className='mana-button';
    link.href='https://scryfall.com/search?q='+encodeURIComponent(name);
    link.target='_blank';
    link.rel='noopener';
    link.textContent='Karte nachschlagen';
    wrap.append(link);
    return wrap;
  }

  const button=document.createElement('button');
  button.className='mana-button';
  button.setAttribute('aria-label','Karteninfo für '+name);
  const cost=faces.map(([,mana])=>mana).filter(Boolean).join(' // ');
  for(const token of cost.match(/\{[^}]+\}|\/\//g)||[]){
    const pip=document.createElement('span');
    pip.className='pip';
    const symbol=token.replace(/[{}]/g,'');
    pip.textContent=symbol;
    pip.dataset.mana=symbol;
    button.append(pip);
  }
  if(!cost)button.textContent=faces[0][2].includes('Land')?'Land':'Info';
  const tip=document.createElement('div');
  tip.className='card-tip';
  tip.id='card-info-'+cardsByName.get(name)[0].replace(/[^a-z0-9]/gi,'-');
  button.setAttribute('aria-describedby',tip.id);
  for(const [face,mana,type,rules] of faces){
    const heading=document.createElement('strong');
    heading.textContent=face+(faces.length>1&&mana?' '+mana:'');
    const typeLine=document.createElement('small');
    typeLine.textContent=type;
    const rulesText=document.createElement('p');
    rulesText.textContent=rules||'Kein zusätzlicher Regeltext.';
    tip.append(heading,typeLine,rulesText);
  }
  button.onclick=()=>{
    const wasOpen=wrap.hasAttribute('data-open');
    closeCardPreviews();
    if(!wasOpen){wrap.removeAttribute('data-dismissed');wrap.setAttribute('data-open','');}
  };
  wrap.onmouseenter=()=>wrap.removeAttribute('data-dismissed');
  button.onfocus=()=>wrap.removeAttribute('data-dismissed');
  wrap.append(button,tip);
  return wrap;
}
function closeCardPreviews(){
  for(const wrap of document.querySelectorAll('.card-info[data-open],.card-info:focus-within,.card-info:hover')){
    wrap.removeAttribute('data-open');
    wrap.setAttribute('data-dismissed','');
  }
}
document.addEventListener('click',event=>{if(!event.target.closest('.card-info'))closeCardPreviews();});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeCardPreviews();});
function render(){
  const query=byId('search').value.trim().toLowerCase();
  const view=byId('view').value;
  const list=byId('list');
  const sections=new Map();
  list.replaceChildren();
  const deck=activeDeck();
  const example=deck&&byId('mode').value==='example';
  const frequency=new Map(deck?.cards.map(([name,count,average])=>[name,[count,average]]));
  const visible=deck?(example?Object.keys(deck.example):deck.cards.map(([name])=>name)).map(name=>cardsByName.get(name)):catalog;
  for(const [name,recommended,category] of visible){
    const group=deck?(example?'Main Deck und Sideboard':'Nach Häufigkeit im Deck') : category;
    const suggested=example?deck.example[name]:deck?Math.round(frequency.get(name)[1]):recommended;
    const count=selected.get(name);
    if(!(name+' '+category).toLowerCase().includes(query)||view==='selected'&&!count||view==='open'&&count)continue;
    if(!sections.has(group)){
      const section=document.createElement('section'),heading=document.createElement('h2');
      heading.textContent=group;section.append(heading);list.append(section);sections.set(group,section);
    }
    const row=document.createElement('article'),label=document.createElement('label'),toggle=document.createElement('input'),qty=document.createElement('input');
    toggle.type='checkbox';toggle.checked=Boolean(count);label.append(toggle,name);
    qty.type='number';qty.min=1;qty.max=620;qty.step=1;qty.value=count||saved.preferred?.[name]||suggested;qty.setAttribute('aria-label','Stückzahl '+name);
    toggle.onchange=()=>{quantities.set(name,Math.max(1,Math.min(620,Math.trunc(Number(qty.value)||suggested))));saved.preferred={...saved.preferred,[name]:quantities.get(name)};selected.set(name,toggle.checked?quantities.get(name):0);save();summary();if(view!=='all')render();};
    qty.onchange=()=>{
      const next=Math.max(1,Math.min(620,Math.trunc(Number(qty.value)||suggested)));
      qty.value=next;quantities.set(name,next);saved.preferred={...saved.preferred,[name]:next};
      if(toggle.checked)selected.set(name,next);
      save();summary();
    };
    const preview=cardPreview(name);
    if(deck){
      const detail=document.createElement('small');
      detail.textContent=example?deck.example[name]+' benötigt':frequency.get(name)[0]+'/'+deck.sample+' Listen · Ø '+frequency.get(name)[1]+'×';
      row.append(label,preview,detail,qty);
    }else row.append(label,preview,qty);sections.get(group).append(row);
  }
  if(!sections.size)list.textContent='Keine Karten in dieser Ansicht.';
}
function exportText(){return catalog.filter(([name])=>selected.get(name)>0).map(([name])=>selected.get(name)+' '+name).join('\n')+'\n';}
byId('download').onclick=()=>{
  const url=URL.createObjectURL(new Blob([exportText()],{type:'text/plain;charset=utf-8'}));
  const link=document.createElement('a');link.href=url;link.download='legacy-bestellung.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
byId('copy').onclick=async()=>{
  try{await navigator.clipboard.writeText(exportText());byId('status').textContent='Bestellliste kopiert.';}
  catch{byId('status').textContent='Kopieren nicht verfügbar. Nutze den Download.';}
};
byId('search').oninput=render;
byId('view').onchange=render;
byId('deck').onchange=()=>{byId('mode').disabled=!activeDeck();byId('search').value='';summary();render();};
byId('mode').onchange=render;
byId('add').onsubmit=event=>{
  event.preventDefault();
  const input=event.currentTarget.elements.card;
  const name=input.value.trim();
  if(!name)return;
  const existing=catalog.find(([card])=>card.toLowerCase()===name.toLowerCase());
  if(!existing){catalog.push([name,1,'Eigene Karten',false]);selected.set(name,1);quantities.set(name,1);cardsByName.set(name,catalog.at(-1));save();}
  byId('deck').value='';byId('mode').disabled=true;byId('search').value=existing?existing[0]:name;byId('view').value='all';input.value='';render();summary();
};
summary();render();
</script></html>
