const key='legacy-proxy-picker-v1';
const byId=id=>document.getElementById(id);
let saved={};
try{saved=JSON.parse(localStorage.getItem(key))||{};}catch{}
const catalog=[...initial,...(saved.custom||[]).filter(([name])=>!initial.some(([card])=>card===name))];
const cardsByName=new Map(catalog.map(card=>[card[0],card]));
for(const deck of [...decks].sort((a,b)=>a.name.localeCompare(b.name))){
  byId('deck').add(new Option(deck.name,deck.name));
}
const activeDeck=()=>decks.find(deck=>deck.name===byId('deck').value);
function coverage(){
  const deck=activeDeck(), info=byId('coverage'), source=byId('source');
  source.replaceChildren();
  if(!deck){info.textContent=decks.length+' Archetypen · '+catalog.length+' Karten im Katalog';return;}
  const entries=Object.entries(deck.example);
  const missing=entries.reduce((sum,[name,count])=>sum+Math.max(0,count-(selected.get(name)||0)),0);
  info.textContent=deck.name+' · '+deck.sample+' ausgewertete Listen · '+deck.cards.length+' Karten im Ranking · Beispiel: '+(missing?missing+' Exemplare fehlen':'vollständig abgedeckt');
  for(const [label,url] of [['Archetyp',deck.source],['Beispielliste',deck.exampleUrl]]){
    if(source.childNodes.length)source.append(' · ');
    const link=document.createElement('a');link.href=url;link.textContent=label;link.target='_blank';link.rel='noopener';source.append(link);
  }
}
const selected=new Map(catalog.map(([name,recommended,,land])=>[name,saved.quantities?.[name]??(land?recommended:0)]));
const quantities=new Map(catalog.map(([name,recommended])=>[name,saved.preferred?.[name]||selected.get(name)||recommended]));
function save(){
  try{localStorage.setItem(key,JSON.stringify({custom:catalog.slice(initial.length),quantities:Object.fromEntries(selected),preferred:saved.preferred}));}catch{byId('status').textContent='Lokales Speichern nicht verfügbar. Exportiere deine Auswahl.';}
}
function summary(){
  coverage();
  const total=[...selected.values()].reduce((a,b)=>a+b,0);
  const remaining=620-total;
  byId('total').textContent=total+' / 620 Exemplare · '+(remaining>=0?remaining+' frei':-remaining+' über dem Limit');
  document.querySelector('progress').value=Math.min(620,total);
  for(const id of ['download','copy'])byId(id).disabled=total===0||remaining<0;
}
function render(){
  const query=byId('search').value.trim().toLowerCase();
  const view=byId('view').value;
  const list=byId('list');
  const sections=new Map();
  list.replaceChildren();
  const deck=activeDeck();
  const example=deck&&byId('mode').value==='example';
  const frequency=new Map(deck?.cards.map(([name,count,average])=>[name,[count,average]]));
  const visible=deck?(example?Object.keys(deck.example):deck.cards.map(([name])=>name)).map(name=>cardsByName.get(name)):catalog;
  for(const [name,recommended,category] of visible){
    const group=deck?(example?'Main Deck und Sideboard':'Nach Häufigkeit im Deck') : category;
    const suggested=example?deck.example[name]:deck?Math.round(frequency.get(name)[1]):recommended;
    const count=selected.get(name);
    if(!(name+' '+category).toLowerCase().includes(query)||view==='selected'&&!count||view==='open'&&count)continue;
    if(!sections.has(group)){
      const section=document.createElement('section'),heading=document.createElement('h2');
      heading.textContent=group;section.append(heading);list.append(section);sections.set(group,section);
    }
    const row=document.createElement('article'),label=document.createElement('label'),toggle=document.createElement('input'),qty=document.createElement('input');
    toggle.type='checkbox';toggle.checked=Boolean(count);label.append(toggle,name);
    qty.type='number';qty.min=1;qty.max=620;qty.step=1;qty.value=count||saved.preferred?.[name]||suggested;qty.setAttribute('aria-label','Stückzahl '+name);
    toggle.onchange=()=>{quantities.set(name,Math.max(1,Math.min(620,Math.trunc(Number(qty.value)||suggested))));saved.preferred={...saved.preferred,[name]:quantities.get(name)};selected.set(name,toggle.checked?quantities.get(name):0);save();summary();if(view!=='all')render();};
    qty.onchange=()=>{
      const next=Math.max(1,Math.min(620,Math.trunc(Number(qty.value)||suggested)));

function exportText(){return catalog.filter(([name])=>selected.get(name)>0).map(([name])=>selected.get(name)+' '+name).join('\n')+'\n';}

};
